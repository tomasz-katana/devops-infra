# Promtail collects container logs and ships them to Loki.
# Docker service discovery is used so log streams are labelled with
# container names rather than opaque container IDs.

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml   # remembers how far each log was read

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Docker prefixes names with a slash, which is stripped here
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
