# Grafana provisioning: data sources come from a file, so a fresh
# container is usable immediately without manual configuration.
# Explicit uids let provisioned dashboards reference these sources.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
