[defaults]
# Default inventory file, so -i is not needed on every command
inventory = inventory.ini

# Skip host key confirmation on first connection.
# Acceptable here: the target is our own machine on an isolated network.
host_key_checking = False

# Readable task output
result_format = yaml

# Do not create .retry files on failure
retry_files_enabled = False

[privilege_escalation]
# Run tasks with administrative privileges
become = True
become_method = sudo
