---
# ============================================================
# PLAYBOOK: prepare the server for application deployment
#
# Turns a clean Ubuntu install into a ready server:
#   - enables non-interactive sudo for the deployment user
#   - keeps the system clock synchronised
#   - installs Docker from the official repository
#   - configures the UFW firewall (deny by default)
#   - hardens SSH (key-based authentication only)
#   - creates configuration directories
#
# Usage:  ansible-playbook playbook.yml
# ============================================================

- name: Prepare server for application deployment
  hosts: servers
  become: true

  vars:
    app_user: devops              # user that will operate Docker
    project_dir: /opt/devops      # directory for configuration files

    # Firewall allowlist. Deliberately minimal - everything else is denied.
    allowed_ports:
      - { port: 22,   desc: "SSH - server management" }
      - { port: 8080, desc: "Application - web page" }
      - { port: 3000, desc: "Grafana - dashboards" }
      - { port: 9090, desc: "Prometheus - metrics" }
      - { port: 9093, desc: "Alertmanager - alerts" }

  tasks:

    # ========================================================
    # SECTION 0: NON-INTERACTIVE SUDO
    # Required for automation: the CI/CD pipeline runs this
    # playbook unattended, so sudo must not prompt for a password.
    # Scope is limited to the dedicated deployment user, whose SSH
    # access is key-only.
    # ========================================================

    - name: Allow passwordless sudo for the deployment user
      ansible.builtin.copy:
        content: "{{ app_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/90-{{ app_user }}"
        owner: root
        group: root
        mode: "0440"
        validate: '/usr/sbin/visudo -cf %s'
      # validate checks the file with visudo BEFORE installing it;
      # a malformed sudoers file would break sudo entirely

    # ========================================================
    # SECTION 1: BASE PACKAGES AND TIME SYNCHRONISATION
    #
    # Clock accuracy matters more than it looks: a skewed clock
    # breaks TLS certificate validation, package repository
    # metadata checks and metric timestamps in Prometheus.
    # ========================================================

    - name: Refresh package index
      ansible.builtin.apt:
        update_cache: true
        # Skip refresh if the cache is younger than one hour, otherwise
        # this task would always report a change and break the
        # idempotence proof (changed=0 on the second run).
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - chrony        # NTP client - keeps the clock in sync
        state: present

    - name: Ensure time synchronisation is running
      ansible.builtin.systemd_service:
        name: chrony
        state: started
        enabled: true

    # ========================================================
    # SECTION 2: DOCKER FROM THE OFFICIAL REPOSITORY
    # Installed from the vendor rather than the Ubuntu archive
    # to get a current version.
    # ========================================================

    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      # get_url does not re-download an existing file - idempotent

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        # signed-by selects the key used to verify package signatures
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        state: present
        filename: docker

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is running and enabled on boot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Add deployment user to the docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true
      # append: true preserves existing groups, including sudo

    # ========================================================
    # SECTION 3: UFW FIREWALL
    #
    # ORDER MATTERS: allow rules are added BEFORE the firewall is
    # enabled. The reverse order would drop the active SSH session
    # mid-run and lock us out of the server.
    # ========================================================

    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow required ports
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.desc }}"
      loop: "{{ allowed_ports }}"
      loop_control:
        label: "{{ item.port }} - {{ item.desc }}"

    - name: Set default policy - deny incoming traffic
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default policy - allow outgoing traffic
      community.general.ufw:
        direction: outgoing
        policy: allow
      # The server must be able to pull images and updates

    - name: Enable the firewall
      community.general.ufw:
        state: enabled

    # ========================================================
    # SECTION 4: SSH HARDENING
    #
    # Ubuntu reads /etc/ssh/sshd_config.d/*.conf BEFORE the rest of
    # the main config, and sshd keeps the FIRST value it finds for
    # each option. cloud-init ships 50-cloud-init.conf with
    # "PasswordAuthentication yes", so editing the main file has no
    # effect. Our drop-in is named 10- so it is read first and wins.
    # ========================================================

    - name: Apply SSH hardening drop-in configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible - do not edit manually.
          # Read before 50-cloud-init.conf, so these values take precedence.
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH
      # validate prevents lockout: a malformed config would stop sshd
      # from starting and cut off all remote access

    # ========================================================
    # SECTION 5: PROJECT DIRECTORIES
    # Monitoring configuration files land here in a later stage.
    # ========================================================

    - name: Create project directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      loop:
        - "{{ project_dir }}"
        - "{{ project_dir }}/monitoring"

  # ==========================================================
  # HANDLERS
  # Run only when triggered by a task that reported a change.
  # SSH is therefore restarted only on an actual config change,
  # not on every playbook run.
  # ==========================================================
  handlers:
    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
